name: classquiz

x-env: &env_vars
  DB_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/classquiz"
  REDIS: "redis://redis:6379/0?decode_responses=True"
  SECRET_KEY: "${SECRET_KEY}"
  MAX_WORKERS: "1"
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  MEILISEARCH_URL: "http://meilisearch:7700"
  ROOT_ADDRESS: "https://quiz.opensuse.id"
  # SMTP belum dikonfigurasi; verifikasi email dilewati
  MAIL_PORT: "587"
  MAIL_ADDRESS: "noreply@quiz.opensuse.id"
  MAIL_PASSWORD: "unset"
  MAIL_USERNAME: "noreply@quiz.opensuse.id"
  MAIL_SERVER: "localhost"
  SKIP_EMAIL_VERIFICATION: "True"
  REGISTRATION_DISABLED: "True"
  STORAGE_BACKEND: "local"
  STORAGE_PATH: "/app/data"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on: [redis, api]
    environment:
      REDIS_URL: redis://redis:6379/0?decode_responses=True
      API_URL: http://api:80

  api:
    image: ghcr.io/mawoka-myblock/classquiz-backend:master
    restart: always
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment: *env_vars
    volumes:
      - ./uploads:/app/data

  worker:
    image: ghcr.io/mawoka-myblock/classquiz-backend:master
    restart: always
    depends_on: [db, redis]
    environment: *env_vars
    command: arq classquiz.worker.WorkerSettings
    volumes:
      - ./uploads:/app/data

  redis:
    image: valkey/valkey:alpine
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]

  db:
    image: postgres:14-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: classquiz
    volumes:
      - db-data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v0.28.0
    restart: always
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/data.ms

  caddy:
    image: caddy:alpine
    restart: always
    depends_on: [frontend, api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  meilisearch-data:
  caddy-data:
  caddy-config:
